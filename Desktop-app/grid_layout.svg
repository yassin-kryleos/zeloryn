<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .grid-cell {
      stroke: #333;
      stroke-width: 1;
      fill: #e0e0e0;
    }
    .cell-text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 20px;
      fill: #333;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
  <!-- Grid cells and labels -->
  <!-- Row 1 -->
  <rect x="0" y="0" width="100" height="100" class="grid-cell"/>
  <text x="50" y="50" class="cell-text">R1C1</text>
  <rect x="100" y="0" width="100" height="100" class="grid-cell"/>
  <text x="150" y="50" class="cell-text">R1C2</text>
  <rect x="200" y="0" width="100" height="100" class="grid-cell"/>
  <text x="250" y="50" class="cell-text">R1C3</text>
  <rect x="300" y="0" width="100" height="100" class="grid-cell"/>
  <text x="350" y="50" class="cell-text">R1C4</text>
  <rect x="400" y="0" width="100" height="100" class="grid-cell"/>
  <text x="450" y="50" class="cell-text">R1C5</text>
  <!-- Row 2 -->
  <rect x="0" y="100" width="100" height="100" class="grid-cell"/>
  <text x="50" y="150" class="cell-text">R2C1</text>
  <rect x="100" y="100" width="100" height="100" class="grid-cell"/>
  <text x="150" y="150" class="cell-text">R2C2</text>
  <rect x="200" y="100" width="100" height="100" class="grid-cell"/>
  <text x="250" y="150" class="cell-text">R2C3</text>
  <rect x="300" y="100" width="100" height="100" class="grid-cell"/>
  <text x="350" y="150" class="cell-text">R2C4</text>
  <rect x="400" y="100" width="100" height="100" class="grid-cell"/>
  <text x="450" y="150" class="cell-text">R2C5</text>
  <!-- Row 3 -->
  <rect x="0" y="200" width="100" height="100" class="grid-cell"/>
  <text x="50" y="250" class="cell-text">R3C1</text>
  <rect x="100" y="200" width="100" height="100" class="grid-cell"/>
  <text x="150" y="250" class="cell-text">R3C2</text>
  <rect x="200" y="200" width="100" height="100" class="grid-cell"/>
  <text x="250" y="250" class="cell-text">R3C3</text>
  <rect x="300" y="200" width="100" height="100" class="grid-cell"/>
  <text x="350" y="250" class="cell-text">R3C4</text>
  <rect x="400" y="200" width="100" height="100" class="grid-cell"/>
  <text x="450" y="250" class="cell-text">R3C5</text>
  <!-- Row 4 -->
  <rect x="0" y="300" width="100" height="100" class="grid-cell"/>
  <text x="50" y="350" class="cell-text">R4C1</text>
  <rect x="100" y="300" width="100" height="100" class="grid-cell"/>
  <text x="150" y="350" class="cell-text">R4C2</text>
  <rect x="200" y="300" width="100" height="100" class="grid-cell"/>
  <text x="250" y="350" class="cell-text">R4C3</text>
  <rect x="300" y="300" width="100" height="100" class="grid-cell"/>
  <text x="350" y="350" class="cell-text">R4C4</text>
  <rect x="400" y="300" width="100" height="100" class="grid-cell"/>
  <text x="450" y="350" class="cell-text">R4C5</text>
</svg>