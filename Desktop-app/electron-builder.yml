appId: com.zeloryn.app
productName: Zeloryn
directories:
  output: dist-desktop
files:
  - dist/**/*
  - dist-backend/**/*
  - src/backend/electron.cjs
  - src/backend/preload.cjs
  - package.json
asarUnpack:
  - dist-backend/**/*
  - node_modules/**/*
publish:
  provider: github
  owner: yassin-kryleos
  repo: zeloryn
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  # pkg target dropped: it needs a Developer ID Installer signing identity
  # that electron-builder doesn't handle gracefully when unsigned (fails
  # with a misleading "not a file" error). Re-add once real Apple signing
  # credentials are configured (see internal-docs branch for context).
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: "${productName}-${version}-${arch}.${ext}"
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"
