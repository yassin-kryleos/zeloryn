appId: com.kryleos.forge
productName: Kryleos Forge
directories:
  output: dist-desktop
files:
  - dist/**/*
  - dist-backend/**/*
  - src/backend/electron.cjs
  - src/backend/preload.cjs
  - package.json
asarUnpack:
  - dist-backend/**/*
  - node_modules/**/*
publish:
  provider: github
  owner: thetimelord69
  repo: Kryleos-forge
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - deb
  category: Development
