name: CI

# Cross-platform continuous integration for Kryleos Forge.
# Runs the full unit/integration test suite, TypeScript type-checking, linting,
# and a production-dependency security audit for all three apps (Desktop, Web,
# Mobile) on Linux, Windows, and macOS. This closes the "no cross-platform CI"
# release-readiness gap: the vitest suites are OS-agnostic and the Electron
# backend is exercised on every supported desktop OS.

on:
  push:
    branches: [main, 'qa/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.app }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        app: [Desktop-app, Web-app, Mobile-app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Production dependency audit (high+)
        # Build tooling (vite/tsx/esbuild) is a devDependency and is not shipped,
        # so the gate audits production runtime deps only.
        run: npm audit --omit=dev --audit-level=high

  lint:
    name: Lint ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Desktop-app, Web-app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  ollama-e2e:
    name: Ollama FORGE end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 1
          done
          echo "Ollama server did not become ready in time" >&2
          exit 1

      - name: Pull model
        run: ollama pull qwen2.5-coder:1.5b

      - name: Run Ollama FORGE e2e test
        run: npx vitest run src/backend/forge_ollama_e2e.test.ts
        env:
          NODE_ENV: test
          OLLAMA_E2E: '1'
          OLLAMA_E2E_MODEL: qwen2.5-coder:1.5b

  release-score:
    name: Release readiness score
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: |
          (cd Desktop-app && npm ci)
          (cd Web-app && npm ci)
          (cd Mobile-app && npm ci)

      - name: Compute release readiness score
        run: node qa/scripts/release-score.mjs
