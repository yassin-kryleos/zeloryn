name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    defaults:
      run:
        working-directory: Desktop-app
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # tree-sitter's native binding doesn't declare C++20 for newer V8/Node
      # headers (open upstream issue: tree-sitter/node-tree-sitter#268).
      # Force it via the compiler's own env-var mechanisms rather than
      # patching node_modules. CXXFLAGS covers GCC/Clang (Linux/macOS); CL
      # is MSVC's equivalent (Windows) -- cl.exe prepends these to every
      # invocation, though project-level flags can still win depending on
      # ordering, so this may need a follow-up if Windows still fails.
      CXXFLAGS: "-std=c++20"
      CL: "/std:c++20"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test validation
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package Windows artifacts
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing certificate detected. Building signed Windows package..."
            npx electron-builder --win --publish never
          else
            echo "No Windows signing credentials configured. Building unsigned package..."
            npx electron-builder --win --config.win.signAndEditExecutable=false --publish never
          fi

      - name: Package macOS artifacts
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            echo "Apple developer credentials detected. Building signed & notarized macOS package..."
            npx electron-builder --mac --publish never
          else
            echo "No Apple Developer signing credentials configured. Building unsigned macOS package..."
            npx electron-builder --mac --config.mac.identity=null --publish never
          fi

      - name: Package Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          npx electron-builder --linux AppImage deb tar.gz --publish never

      - name: Generate platform checksums
        shell: bash
        run: |
          cd dist-desktop
          : > SHA256SUMS.txt
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$file" >> SHA256SUMS.txt
              else
                shasum -a 256 "$file" >> SHA256SUMS.txt
              fi
            fi
          done
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            Desktop-app/dist-desktop/*
            !Desktop-app/dist-desktop/win-unpacked/
            !Desktop-app/dist-desktop/mac*/
            !Desktop-app/dist-desktop/linux-unpacked/

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare consolidated release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find all-artifacts -type f ! -name "SHA256SUMS.txt" -exec cp {} release-assets/ \;

          cd release-assets
          : > SHA256SUMS.txt
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          echo "=== Consolidated SHA256SUMS ==="
          cat SHA256SUMS.txt

      - name: Determine tag name
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Zeloryn ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*

  update-distribution:
    name: Update Homebrew & Winget Manifests
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update local distribution manifests
        shell: bash
        run: |
          mkdir -p release-assets
          find all-artifacts -type f ! -name "SHA256SUMS.txt" -exec cp {} release-assets/ \;
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          node distribution/scripts/update-distribution-manifests.mjs "$TAG" release-assets/

      - name: Upload updated distribution manifests
        uses: actions/upload-artifact@v4
        with:
          name: distribution-manifests
          path: |
            distribution/homebrew/Casks/zeloryn.rb
            distribution/homebrew/Formula/zeloryn.rb
            distribution/winget/Zeloryn.Zeloryn.yaml

      - name: Sync Homebrew Tap (Optional)
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          echo "Syncing updated Cask to homebrew-zeloryn repository..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yassin-kryleos/homebrew-zeloryn.git" tap-repo
          mkdir -p tap-repo/Casks
          cp distribution/homebrew/Casks/zeloryn.rb tap-repo/Casks/
          cd tap-repo
          git add Casks/zeloryn.rb
          git commit -m "Update zeloryn to ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push origin main || echo "Failed to push to tap repo"
