name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Artifact channel
        required: true
        type: choice
        options: [invited-beta-unsigned, public-signed]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Desktop-app
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Desktop-app/package-lock.json
      - run: npm ci
      - name: Verify desktop release input
        run: |
          npm run lint
          npm test
      - name: Require signing credentials for public release
        if: inputs.channel == 'public-signed'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" && -z "$WIN_CSC_LINK" ]]; then exit 1; fi
          if [[ "${{ runner.os }}" == "macOS" && ( -z "$CSC_LINK" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ) ]]; then exit 1; fi
      - name: Build package
        shell: bash
        run: |
          if [[ "${{ inputs.channel }}" == "invited-beta-unsigned" ]]; then
            npm run build
            npx electron-builder --config.win.signAndEditExecutable=false
          else
            npm run dist
          fi
      - name: Checksums
        shell: bash
        run: |
          cd dist-desktop
          : > SHA256SUMS.txt
          for file in *; do
            if [[ -f "$file" && "$file" != "SHA256SUMS.txt" ]]; then
              if command -v sha256sum >/dev/null; then sha256sum "$file" >> SHA256SUMS.txt; else shasum -a 256 "$file" >> SHA256SUMS.txt; fi
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kryleos-forge-${{ matrix.artifact }}-${{ inputs.channel }}
          path: Desktop-app/dist-desktop/**

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npx --yes @cyclonedx/cyclonedx-npm@4.2.1 --package-lock-only Desktop-app/package-lock.json --output-file desktop-sbom.json
      - run: npx --yes @cyclonedx/cyclonedx-npm@4.2.1 --package-lock-only Web-app/package-lock.json --output-file web-sbom.json
      - run: npx --yes @cyclonedx/cyclonedx-npm@4.2.1 --package-lock-only Mobile-app/package-lock.json --output-file mobile-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sboms
          path: '*-sbom.json'
